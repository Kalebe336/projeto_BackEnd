<!DOCTYPE html>

<head>

    <link rel="icon" type="image/png" href="img/aa5e27436f6f22dc229b21f4f152198f-icone-plano-frontal-de-chapeu-de-chef.webp">
    <link rel="stylesheet" href="style.css">
    <title>SaepChef</title>
</head>
<body>
    <input type="checkbox" id="modal-controle" class="modal-toggle">

     <header class="header">
        <div class="user-section">
            <div class="profile-pic" img src="imagens_usuarios/saepChef.jpg" alt=""></div>
            <span class="username">@SAEPChef</span>
            <button class="btn-profile" disabled>Ver Perfil</button>
        </div>

        <div class="company-section">
            <h1>SAEPChef</h1>
        </div>

        <div class="login-section">
            <label for="modal-controle" class="btn-login-label">Login</label>
        </div>
    </header>

                </div>
                <input type="file" id="arquivo-1" name="arquivo" class="file-input">
